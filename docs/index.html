<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Starfield Particle System - Spec</title>
  <style>
    body{font-family:Inter,system-ui,Segoe UI,Roboto,Helvetica,Arial,sans-serif;line-height:1.6;margin:0;padding:32px;background:#0b1020;color:#e6eef8}
    .container{max-width:900px;margin:0 auto;background:rgba(255,255,255,0.02);padding:28px;border-radius:10px;box-shadow:0 6px 30px rgba(2,6,23,0.6)}
    pre,code{background:rgba(255,255,255,0.03);padding:6px;border-radius:6px;overflow:auto}
    h1,h2,h3{color:#fff}
    a{color:#7fd1ff}
  </style>
</head>
<body>
  <div class="container">
    <div id="content">Loading spec…</div>
    <footer style="margin-top:28px;color:#94a3b8;font-size:14px">Served from <a href="https://github.com/gchyczy0713-dot/Starfield/blob/main/spec_1.md">spec_1.md</a></footer>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script>
    (async ()=>{
      try{
        const rawUrl = 'https://raw.githubusercontent.com/gchyczy0713-dot/Starfield/main/spec_1.md';
        const res = await fetch(rawUrl);
        if(!res.ok) throw new Error('Failed to fetch spec: '+res.status);
        const md = await res.text();
        document.getElementById('content').innerHTML = marked.parse(md);
      }catch(e){
        document.getElementById('content').textContent = e.message;
      }
    })();
  </script>
</body>
</html>
